# ══════════════════════════════════════════════════════════════════════
# Cercus Framework — User Configuration
# ══════════════════════════════════════════════════════════════════════
#
# This file overrides defaults from cercus/config/defaults/*.yaml.
# Only include values you want to override — unused defaults are
# automatically loaded.
#
# For trajectory presets and documentation, see:
#   cercus/config/defaults/trajectory.yaml
# ══════════════════════════════════════════════════════════════════════

# ── Escape Detection Thresholds ──────────────────────────────────────
thresholds:
  escape:
    start_threshold: 10.0   # mm/s - latency onset anchor (speed exceeds this -> escape start)
    vmax_threshold: 50.0    # mm/s - burst floor for valid escape (v_max must exceed this)

# ── Population Analysis Adaptive Thresholding ──────────────────────────
analysis:
  vmax_thresholding:
    use_adaptive: false       # false = use escape.vmax_threshold (50.0); true = auto KDE/GMM
    fallback_threshold: 50.0  # mm/s - used when adaptive=true and all methods fail
    kde_search_upper: 400.0   # mm/s - KDE valley search upper bound
    enable_iqr_gmm: false     # set true to enable IQR-adaptive GMM candidate
  # ── Individual-Level Robustness Analysis ─────────────────────────────
  individual:
    min_trials_second_order: 3   # min escape trials to enter per-animal second-order Rayleigh
    min_trials_wallraff: 5       # min escape trials to enter k-sample Wallraff dispersion test
    bootstrap_iterations: 1000   # animal-level bootstrap resamples for the pooled-mu CI



trajectory:
  use_z_degree_to_draw: true
  use_escape_onset_heading: false
  use_escape_onset_only_xy: true
  use_angular_velocity_offset: false
  dz_integration_range: "peak_bracket"
  use_rigid_rotation: true
  wind_angle_offset_deg: 0  # wind -12.6 ponytail: 0 = legacy no-op; a *positive* value rotates body (dx,dy) CCW (arena trajectory CW). Set to calibrate_offset.py delta (e.g. -13.8 from Data/bw, 402 escapes, pooled) — rotates body CCW 13.8° → fixes wind-only left/right asymmetry; applies to wind trials only.
  wind_angle_offset_targets:   # Array of modules to apply offset: ["trajectory"], ["polar"], ["individual"]
    - "trajectory"

