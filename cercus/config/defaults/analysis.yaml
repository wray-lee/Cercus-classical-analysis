# ══════════════════════════════════════════════════════════════════════
# Cercus Framework — Individual-Level Robustness Analysis Configuration
# ══════════════════════════════════════════════════════════════════════
# Thresholds for the per-animal robustness checks (see
# cercus/analysis/individual.py). These values can be overridden by user
# config.yaml in project root.

individual:
  # Minimum escape trials an animal must have to enter the second-order
  # (per-animal mean direction) Rayleigh test. With <3 trials the per-animal
  # circular mean is not a stable estimate of that animal's preference.
  min_trials_second_order: 3

  # Minimum escape trials an animal must have to enter the k-sample Wallraff
  # dispersion test. With <5 trials the within-animal resultant length R_k is
  # badly biased (a single trial has R_k ≡ 1), so low-n animals are excluded.
  min_trials_wallraff: 5

  # Number of bootstrap iterations for the animal-level resampling CI.
  bootstrap_iterations: 1000

  # Include PreEscape and PreWalk alongside Escape in population individual checks.
  include_prewalk: true

# Population rendering: each worker loads the full frame once from a snapshot.
parallel:
  # Conservative default verified on the 360-trial replay; tune for other datasets.
  # The pool also respects --workers and never exceeds the figure job count.
  render_workers: 4
  # WSL path for temporary snapshots; each run removes its cache on pool exit.
  cache_dir: /mnt/d/Data/Results/tmp

# Adaptive V_max thresholding in population_analysis.py
vmax_thresholding:
  # Set true to use adaptive threshold (KDE/GMM); false to use escape.vmax_threshold from config
  use_adaptive: false
  # mm/s — used when all auto-threshold methods fail
  fallback_threshold: 120.0
  # mm/s — upper bound of the KDE valley search range
  kde_search_upper: 400.0
  # set true to also compute the IQR-adaptive GMM as a candidate threshold
  enable_iqr_gmm: false

# Raw-vs-derived response grouping (main aggregate plots only).
response_grouping:
  # true  = main derived "Escape" = raw Escape + raw PreWalk (merged burst responses);
  #         PreEscape and NoResponse stay separate; raw PreWalk diagnostics unchanged.
  # false = legacy split: derived groups mirror raw labels exactly.
  # Must be a YAML boolean — a string like "false" is rejected, never coerced.
  merge_prewalk: true

# MS mode: immediate pattern directories; incomplete conditions stay visible.
multisensory:
  expected_patterns: [bv, bw, "-373 30°", "-308 36°", "-261 42°", "-225 48°", "-119 80°", "0 180°", "+200"]
  # 'all' is an aggregate/legacy export, not another independent paradigm.
  exclude_directories: [all, full, ms, output, figures, results, test, train, garbage, pilot]
  workers: 1  # bounded memory: workers return trial summaries, not full pooled frames
  bootstrap_iterations: 2000
  min_subjects: 2
  confidence_level: 0.95
  random_seed: 42
