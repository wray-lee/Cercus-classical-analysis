# ══════════════════════════════════════════════════════════════════════
# Cercus Framework — Trajectory Configuration
# ══════════════════════════════════════════════════════════════════════
# Trajectory rendering and integration settings.
# These values can be overridden by user config.yaml in project root.
#
# This file also documents the alternative trajectory presets that
# are available. Uncomment the desired preset in config.yaml to
# activate it.
# ══════════════════════════════════════════════════════════════════════



#=======================================
# baseline_visual
#========================================

trajectory:
  use_z_degree_to_draw: true
  use_escape_onset_heading: false
  use_escape_onset_only_xy: true
  use_angular_velocity_offset: false
  dz_integration_range: "escape_angular_peak"
  use_rigid_rotation: true


