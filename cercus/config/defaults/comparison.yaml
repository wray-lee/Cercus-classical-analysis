# ══════════════════════════════════════════════════════════════════════
# Cercus Framework — Cross-Paradigm Comparison Preset
# ══════════════════════════════════════════════════════════════════════
# Trajectory settings optimized for fair comparison between visual-looming,
# wind, and bimodal stimuli (peak_bracket integration).
# Use this preset when plotting escape angles or investigating paradigm effects.
# ══════════════════════════════════════════════════════════════════════

trajectory:
  use_z_degree_to_draw: true
  use_escape_onset_heading: false
  use_escape_onset_only_xy: true
  use_angular_velocity_offset: false
  dz_integration_range: "peak_bracket"
  use_rigid_rotation: true

visualization:
  bar_label_style: inline
