# ══════════════════════════════════════════════════════════════════════
# Cercus Framework — Threshold Configuration
# ══════════════════════════════════════════════════════════════════════
# Physical thresholds for escape detection and classification.
# These values can be overridden by user config.yaml in project root.

# ── Escape Detection Thresholds ──
escape:
  start_threshold: 10.0    # mm/s — latency onset anchor (speed exceeds this → escape start)
  vmax_threshold: 98.0     # mm/s — burst floor for valid escape (v_max must exceed this)
  window_ms: 250.0         # ms — post-stimulus burst detection window
  use_angular_onset_refinement: false  # refine escape onset via angular-velocity zero before peak
  angular_onset_window_ms: 100.0       # ms — search window around coarse 10 mm/s onset
  angular_onset_eps_deg: 2.0           # deg/s — peak_bracket below-eps / sign-change threshold

# ── PreWalk Detection Thresholds ──
prewalk:
  threshold: 10.0            # mm/s — pre-stimulus spontaneous activity
  window_ms: 1000.0        # ms — pre-stimulus validation window
  min_moving_fraction: 0.15  # minimum time fraction > quiet threshold (>=); inherited activity cutoff, not paper criterion

# ── Baseline & Buffer Settings ──
baseline:
  quiet_mm_s: 10.0         # mm/s — stopping: observed downward crossing below this speed (2023 moving-cricket criterion)

stillness:
  speed_window_ms: 20.0      # ms — causal displacement average; ~4 optical counts at 10 mm/s, not a latency floor
  max_frame_gap_factor: 3.0  # × median acquisition interval — reject unobserved motion
  displacement_quantum_mm: 0.04712389  # mm/axis count — local resolution margin, not a validated error bound

reaction_time:
  independent_rtm: true    # true = causal reference-to-escape RTm without requiring T1/T2; false = legacy stop-dependent RTm
  short_escape_ms: 50.0    # ms — QC flag only; never clamp measured latency
  wind_arrival_delay_ms: 0.0  # ms — measured delay from stim_state to airflow at animal; 0 = uncalibrated

post_stim:
  buffer_ms: 50.0          # ms — post-stimulus tail buffer

# ── PreEscape (multisensory paradigm) ──
# 风前纯视觉触发的真逃逸单独成类；false 回退三元行为
classification:
  use_preescape: true          # 第四行为类开关
  preescape_buffer_ms: 0.0     # onset 须早于 wind 超过此值才算 preescape（0 = 无死区，风前起跑皆为 PreEscape）
